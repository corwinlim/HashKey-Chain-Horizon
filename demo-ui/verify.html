<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CaniTrust — Verify Pet Trust</title><style>body{font-family:system-ui;margin:0;background:#f6f3ea;color:#1f2a24}main{max-width:720px;margin:32px auto;padding:0 16px}.card{background:#fffdf8;border:1px solid #dcd7ca;border-radius:22px;padding:24px}.status{padding:20px;border-radius:16px}.verified{background:#e9f5ee;color:#1f7a52}.revoked{background:#f8e9e7;color:#a33a37}.invalid{background:#faf0d7;color:#8d691c}.row{padding:12px 0;border-top:1px solid #dcd7ca}.proof{overflow-wrap:anywhere;font:12px monospace}.muted{color:#66706a}</style></head><body><main><h2>CaniTrust</h2><section class="card"><div id="status" class="status invalid"><h1 id="title">INVALID</h1><p id="copy">Checking verification token.</p></div><div class="row"><b>Pet</b><div id="pet">—</div></div><div class="row"><b>Pet Trust ID</b><div id="pet-id">—</div></div><div class="row"><b>Issuer provenance</b><div id="issuer">—</div></div><div class="row"><b>Failure codes</b><div id="failures">None</div></div><div class="row"><b>Proof hash</b><div id="proof" class="proof">null</div></div><p class="muted">Privacy boundary: no owner government ID, address/contact, clinical record, CAIOS Memory/Context, or recommendation payload is disclosed.</p></section></main><script src="./qr-app.js"></script><script>const e={status:document.getElementById('status'),title:document.getElementById('title'),copy:document.getElementById('copy'),pet:document.getElementById('pet'),id:document.getElementById('pet-id'),issuer:document.getElementById('issuer'),failures:document.getElementById('failures'),proof:document.getElementById('proof')};function render(state,payload,codes,proof){e.status.className='status '+state.toLowerCase();e.title.textContent=state;e.copy.textContent=state==='VERIFIED'?'Identity and credential integrity verified for this demo proof.':state==='REVOKED'?'Credential is revoked. Verification denied.':'Token cannot be trusted. Verification denied.';e.pet.textContent=payload?.petTrustId==='ct_pet_pika_demo'?'Pika':'—';e.id.textContent=payload?.petTrustId||'—';e.issuer.textContent=payload?.issuerId||'—';e.failures.textContent=codes.length?codes.join(', '):'None';e.proof.textContent=proof||'null';}async function main(){const token=new URLSearchParams(location.search).get('token');if(!token)return render('INVALID',null,['QR_MALFORMED'],null);let env;try{env=CaniTrustQR.decode(token);}catch{return render('INVALID',null,['QR_MALFORMED'],null)}const v=await CaniTrustQR.verifyEnvelope(env);if(!v.valid)return render('INVALID',env.payload,v.failureCodes,null);if(env.payload.scenario==='revoked')return render('REVOKED',env.payload,['CREDENTIAL_REVOKED'],null);const proof=await CaniTrustQR.sha256Hex({petTrustId:env.payload.petTrustId,credentialIds:[...env.payload.credentialIds].sort(),issuerId:env.payload.issuerId,issuedAt:env.payload.issuedAt,integrityHash:env.integrityHash,verificationState:'VERIFIED'});render('VERIFIED',env.payload,[],proof);}main();</script></body></html>
