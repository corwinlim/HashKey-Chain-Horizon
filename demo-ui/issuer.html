<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CaniTrust — Pika QR Issuer</title><style>body{font-family:system-ui;margin:0;background:#f6f3ea;color:#1f2a24}main{max-width:900px;margin:32px auto;padding:0 16px}.card{background:#fffdf8;border:1px solid #dcd7ca;border-radius:22px;padding:24px;margin-top:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}button{padding:14px 18px;border:0;border-radius:12px;background:#1f2a24;color:white;font-weight:700}.muted{color:#66706a}.url{overflow-wrap:anywhere;font:12px monospace}.qr{min-height:280px;display:grid;place-items:center;background:white;border-radius:16px}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><main><h1>CaniTrust Stage‑1 — Pika</h1><p class="muted">Generate a real scannable verification QR. Mock Authority data only; no owner PII or CAIOS private context is encoded.</p><div class="grid"><section class="card"><h2>Pika Trust Card</h2><p><b>Pet Trust ID</b><br>ct_pet_pika_demo</p><p><b>Issuer</b><br>Mock Authority MY Demo</p><p><label><input type="radio" name="scenario" value="valid" checked> Valid</label> <label><input type="radio" name="scenario" value="revoked"> Revoked</label></p><button id="generate">Generate verification QR</button></section><section class="card"><div id="qr-target" class="qr">Generate a QR to begin</div><p id="scan-url" class="url muted">No scan URL yet.</p></section></div></main><script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script><script src="./qr-app.js"></script><script>document.getElementById('generate').addEventListener('click',async()=>{const scenario=document.querySelector('input[name=scenario]:checked').value;const payload={version:'ctqr-v1',petTrustId:'ct_pet_pika_demo',credentialIds:['cred-pika-identity','cred-pika-owner'],issuerId:'mock-authority-my-demo',nonce:crypto.randomUUID?crypto.randomUUID():String(Date.now()),issuedAt:new Date().toISOString(),scenario};const envelope=await CaniTrustQR.createEnvelope(payload);const token=CaniTrustQR.encode(envelope);const url=new URL('./verify.html',location.href);url.searchParams.set('token',token);const target=document.getElementById('qr-target');target.innerHTML='';new QRCode(target,{text:url.href,width:240,height:240,correctLevel:QRCode.CorrectLevel.M});document.getElementById('scan-url').textContent=url.href;});</script></body></html>
